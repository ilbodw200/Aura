name: Build unsigned iPhone IPA
on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS build pool
        type: choice
        options: [macos-26, macos-15]
        default: macos-26
      variant:
        description: 'preview = interface only; full = compile and link VPN core'
        type: choice
        options: [preview, full]
        default: preview
permissions:
  contents: read
jobs:
  ipa:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 on fallback runner
        if: inputs.runner == 'macos-15'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/setup-go@v5
        if: inputs.variant == 'full'
        with:
          go-version: '1.24.2'
          cache: false
      - uses: actions/cache/restore@v4
        if: inputs.variant == 'full'
        id: libbox-cache
        with:
          path: Vendor/Libbox.xcframework
          key: libbox-v1.11.15-gomobile0.1.4-go1.24.2-${{ inputs.runner || 'macos-26' }}-${{ runner.arch }}-aura-mask-v1
      - name: Compile iPhone app and package unsigned IPA
        env:
          AURA_VARIANT: ${{ inputs.variant }}
          AURA_USE_CACHED_LIBBOX: ${{ steps.libbox-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: bash Scripts/build-ipa.sh unsigned "$AURA_VARIANT"
      - name: Upload compiled unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AURA-${{ inputs.variant }}-UNSIGNED-needs-Apple-signing
          path: build-ipa.*/export/*.ipa
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always() && inputs.variant == 'full' && steps.libbox-cache.outputs.cache-hit != 'true' && hashFiles('Vendor/Libbox.xcframework/Info.plist') != ''
        with:
          path: Vendor/Libbox.xcframework
          key: libbox-v1.11.15-gomobile0.1.4-go1.24.2-${{ inputs.runner || 'macos-26' }}-${{ runner.arch }}-aura-mask-v1
