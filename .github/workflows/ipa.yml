name: Build unsigned iPhone IPA
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'preview = interface only; full = compile and link VPN core'
        type: choice
        options: [preview, full]
        default: preview
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/setup-go@v5
        if: inputs.variant == 'full'
        with:
          go-version: '1.24.2'
          cache: false
      - name: Compile iPhone app and package unsigned IPA
        env:
          AURA_VARIANT: ${{ inputs.variant }}
        run: bash Scripts/build-ipa.sh unsigned "$AURA_VARIANT"
      - name: Upload compiled unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AURA-${{ inputs.variant }}-UNSIGNED-needs-Apple-signing
          path: build-ipa.*/export/*.ipa
          if-no-files-found: error
          retention-days: 7
