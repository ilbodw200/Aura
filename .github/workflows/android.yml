name: Android APK build and tests
on:
  workflow_dispatch:
    inputs:
      core_only:
        type: boolean
        description: Build and inspect Libbox only
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - uses: actions/cache/restore@v4
        id: core-cache
        with:
          path: Android/app/libs/libbox.aar
          key: android-libbox1.11.15-go1.24.2-ndk28-arm-arm64-amd64-aura-mask-v1
      - name: Build Android VPN core
        env:
          AURA_USE_CACHED_ANDROID_CORE: ${{ steps.core-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: bash Scripts/bootstrap-android-core.sh
      - name: Inspect generated Java interface
        run: |
          unzip -p Android/app/libs/libbox.aar classes.jar > "$RUNNER_TEMP/libbox-classes.jar"
          javap -classpath "$RUNNER_TEMP/libbox-classes.jar" io.nekohasekai.libbox.PlatformInterface io.nekohasekai.libbox.Libbox
      - uses: actions/cache/save@v4
        if: steps.core-cache.outputs.cache-hit != 'true'
        with:
          path: Android/app/libs/libbox.aar
          key: android-libbox1.11.15-go1.24.2-ndk28-arm-arm64-amd64-aura-mask-v1
      - uses: actions/upload-artifact@v4
        if: inputs.core_only
        with:
          name: Android-Libbox
          path: Android/app/libs/libbox.aar
          retention-days: 1
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ !inputs.core_only }}
        with:
          gradle-version: '8.11.1'
      - name: Configure persistent APK signing key
        if: ${{ !inputs.core_only }}
        env:
          STORE_B64: ${{ secrets.AURA_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.AURA_ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$STORE_B64" && test -n "$STORE_PASSWORD"
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/aura-release.p12"
          echo "AURA_SIGNING_STORE=$RUNNER_TEMP/aura-release.p12" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        if: ${{ !inputs.core_only }}
        env:
          AURA_SIGNING_PASSWORD: ${{ secrets.AURA_ANDROID_SIGNING_PASSWORD }}
        run: gradle -p Android --no-daemon testReleaseUnitTest assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Verify APK signature
        if: ${{ !inputs.core_only }}
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs Android/app/build/outputs/apk/release/app-release.apk"
      - name: Enable KVM for emulator
        if: ${{ !inputs.core_only }}
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: ${{ !inputs.core_only }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            gradle -p Android --no-daemon connectedDebugAndroidTest || { adb pull /sdcard/Aura-Minimal-Home.png Aura-Minimal-Home.png; adb pull /sdcard/Aura-Minimal-Servers.png Aura-Minimal-Servers.png; adb pull /sdcard/Aura-Minimal-Selected.png Aura-Minimal-Selected.png; exit 1; }
            adb pull /sdcard/Aura-Library.png Aura-Library.png
            adb pull /sdcard/Aura-Ping.png Aura-Ping.png
            adb pull /sdcard/Aura-Minimal-Home.png Aura-Minimal-Home.png
            adb pull /sdcard/Aura-Minimal-Servers.png Aura-Minimal-Servers.png
            adb pull /sdcard/Aura-Minimal-Selected.png Aura-Minimal-Selected.png
            if adb shell pm list packages | grep -qx 'package:app.aura.android'; then adb uninstall app.aura.android; fi
            adb install Android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n app.aura.android/.MainActivity
            sleep 4
            adb shell screencap -p /sdcard/Aura-Android.png
            adb pull /sdcard/Aura-Android.png Aura-Android.png
            adb logcat -d -s AndroidRuntime > Android-launch.log
            if grep -q 'FATAL EXCEPTION' Android-launch.log; then cat Android-launch.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.core_only }}
        with:
          name: AURA-Android-signed-APK
          path: Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.core_only
        with:
          name: Android-test-results
          path: |
            Android/app/build/reports/
            Android/app/build/outputs/androidTest-results/
            Aura-Android.png
            Aura-Library.png
            Aura-Ping.png
            Aura-Minimal-Home.png
            Aura-Minimal-Servers.png
            Aura-Minimal-Selected.png
            Android-launch.log
