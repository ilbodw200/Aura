name: iOS UI build and tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate UI project
        run: |
          brew install xcodegen
          bash Scripts/generate.sh
      - name: Test on available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          echo "AURA_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild test -project Aura.xcodeproj -scheme Aura -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult
      - name: Launch app and capture actual simulator screen
        run: |
          xcrun simctl bootstatus "$AURA_SIMULATOR_ID" -b
          xcrun simctl ui "$AURA_SIMULATOR_ID" appearance dark
          xcrun simctl launch "$AURA_SIMULATOR_ID" app.aura.proxy
          sleep 4
          xcrun simctl io "$AURA_SIMULATOR_ID" screenshot Aura-iPhone.png
      - uses: actions/upload-artifact@v4
        with:
          name: Aura-iPhone-screen
          path: Aura-iPhone.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: TestResults.xcresult
