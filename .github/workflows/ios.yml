name: iOS build, core tests and launch
on:
  push:
    branches: [main]
    paths: ['Aura/**', 'Shared/**', 'Tunnel/**', 'Tests/**', 'UITests/**', 'Config/**', 'project*.yml', 'Package.swift', '.github/workflows/ios.yml']
  pull_request:
    paths: ['Aura/**', 'Shared/**', 'Tunnel/**', 'Tests/**', 'UITests/**', 'Config/**', 'project*.yml', 'Package.swift', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      runner:
        description: macOS build pool
        type: choice
        options: [macos-26, macos-15, macos-15-intel]
        default: macos-26
jobs:
  test:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 on fallback runner
        if: startsWith(inputs.runner, 'macos-15')
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Generate UI project
        run: |
          brew install xcodegen
          bash Scripts/generate.sh
      - name: Run shared implementation tests on macOS
        run: swift test
      - name: Build for iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); a=[x for k,v in d["devices"].items() for x in v if "iOS-26" in k and x["name"].startswith("iPhone")]; print(next(iter(a))["udid"])')
          echo "AURA_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcodebuild build -project Aura.xcodeproj -scheme Aura -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Verify scrolling through 57 servers and selecting the last one
        run: |
          xcrun simctl bootstatus "$AURA_SIMULATOR_ID" -b
          xcodebuild test -project Aura.xcodeproj -scheme AuraScrolling -destination "platform=iOS Simulator,id=$AURA_SIMULATOR_ID" -derivedDataPath DerivedData -resultBundlePath ScrollTestResults.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Launch app and capture actual simulator screen
        run: |
          xcrun simctl bootstatus "$AURA_SIMULATOR_ID" -b
          xcrun simctl ui "$AURA_SIMULATOR_ID" appearance dark
          xcrun simctl install "$AURA_SIMULATOR_ID" DerivedData/Build/Products/Debug-iphonesimulator/Aura.app
          xcrun simctl launch "$AURA_SIMULATOR_ID" app.aura.proxy
          sleep 4
          xcrun simctl io "$AURA_SIMULATOR_ID" screenshot Aura-iPhone.png
      - name: Export scrolling test screenshots
        if: always()
        run: |
          if [ -d ScrollTestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path ScrollTestResults.xcresult --output-path ScrollScreens
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aura-iPhone-screen
          path: |
            Aura-iPhone.png
            ScrollTestResults.xcresult
            ScrollScreens
          if-no-files-found: warn
