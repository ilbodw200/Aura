name: iOS UI build and tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate UI project
        run: |
          brew install xcodegen
          bash Scripts/generate.sh
      - name: Test on available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          xcodebuild test -project Aura.xcodeproj -scheme Aura -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: TestResults.xcresult
