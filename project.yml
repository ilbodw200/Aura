name: Aura
options:
  bundleIdPrefix: app.aura
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 1.0.2
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    AURA_BUNDLE_ID: app.aura.proxy
    AURA_TUNNEL_BUNDLE_ID: $(AURA_BUNDLE_ID).tunnel
    AURA_APP_GROUP: group.$(AURA_BUNDLE_ID)
targets:
  Aura:
    type: application
    platform: iOS
    sources: [Aura, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AURA_BUNDLE_ID)
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AuraTunnel
        embed: true
  AuraTunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AURA_TUNNEL_BUNDLE_ID)
        INFOPLIST_FILE: Config/Tunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Tunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  AuraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Aura
  AuraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AURA_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Aura
schemes:
  Aura:
    build:
      targets:
        Aura: all
    test:
      targets: [AuraTests]
  AuraScrolling:
    build:
      targets:
        Aura: all
        AuraUITests: [test]
    test:
      targets: [AuraUITests]
